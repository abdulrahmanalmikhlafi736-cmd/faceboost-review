# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:

# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository. For more information, see: https://docs.datadoghq.com/account_management/api-app-keys/.
# 2. Start using the action within your workflow

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Run Synthetic tests within your GitHub workflow.
    # For additional configuration options visit the action within the marketplace: https://github.com/marketplace/actions/datadog-synthetics-ci
    - name: Run Datadog Synthetic tests
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{secrets.DD_API_KEY}}
        app_key: ${{secrets.DD_APP_KEY}}
        test_search_query: 'tag:e2e-tests' #Modify this tag to suit your tagging strategy
        
- name: Rational Functional Tester GitHub Action
  # You may pin to the exact commit or the version.
  # uses: IBM/devopsauto-functest-actions@e310434389a6996a7835fd14e240801d5a5bd067
  uses: IBM/devopsauto-functest-actions@v1
  with:
    # The fully qualified path to _prop_task_ui_productName_ project directory.
    projectDirectory: 
    # Name of the script to be executed without the extension. For eg., Script1 or TestFolder.Script1 in case Script1 is in a folder named TestFolder.
    scriptName: 
    # The number of Dataset iterations to be run.
    iterationCount: # optional
    # The format of the script logs, For Example XML, HTML
    logFormat: # optional
    # Additional playback arguments, if any.
    userArguments: # optional


- name: Run test on Autify for Mobile
  # You may pin to the exact commit or the version.
  # uses: autifyhq/actions-mobile-test-run@947f59239607effb503c765d7ee2d24ccf785fd9
  uses: autifyhq/actions-mobile-test-run@v2.5.0
  with:
    # Access token of Autify for Mobile.
    access-token: 
    # URL of a test plan e.g. https://moible-app.autify.com/projects/<ID>/test_plans/<ID>
    autify-test-url: 
    # ID of the already uploaded build. (Note: Either build-id or build-path is required but not both)
    build-id: # optional
    # File path to the iOS app (*.app) or Android app (*.apk). (Note: Either build-id or build-path is required but not both)
    build-path: # optional
    # When true, the action waits until the test finishes.
    wait: # optional, default is false
    # Timeout seconds when waiting.
    timeout: # optional
    # Maximum retry count while waiting. The command can take up to `timeout * (max-retry-count + 1)`. Only effective with `wait`
    max-retry-count: # optional
    # A path to `autify` which will be used to invoke Autify CLI internally. Default is searching from PATH.
    autify-path: # optional, default is autify
    # Autify CLI installer URL
    autify-cli-installer-url: # optional, default is https://autify-cli-assets.s3.amazonaws.com/autify-cli/channels/stable/install-cicd.bash
    
